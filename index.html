<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SNELWEG RACER — 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  canvas{display:block;touch-action:none}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:1;width:100%;height:100%}

  /* ============ LOAD SCREEN ============ */
  #loadScreen{position:fixed;inset:0;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;
    background:linear-gradient(180deg,#0a1018 0%,#0f1a2c 45%,#050a14 100%);
    opacity:0;pointer-events:none;transition:opacity .32s ease}
  #loadScreen.show{opacity:1;pointer-events:auto}
  #loadScreen.hidden{display:none}
  #loadScreen::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,transparent 0 40px,
      rgba(90,180,255,.04) 40px 42px,transparent 42px 120px),
      radial-gradient(ellipse at 50% 0%,rgba(60,140,220,.15),transparent 65%);
    pointer-events:none}
  .loader{width:60px;height:60px;border-radius:50%;
    border:4px solid rgba(120,200,255,0.12);
    border-top-color:#4fc3f7;
    animation:loadSpin .85s linear infinite;
    box-shadow:0 0 32px rgba(79,195,247,0.45);
    position:relative;z-index:1}
  @keyframes loadSpin{to{transform:rotate(360deg)}}
  .load-text{font-size:11px;letter-spacing:5px;font-weight:900;color:#7ac2ff;
    text-transform:uppercase;animation:loadPulse 1.3s ease infinite;
    position:relative;z-index:1}
  @keyframes loadPulse{0%,100%{opacity:.4}50%{opacity:1}}

  /* ============ HUD ============ */
  #hud{position:fixed;top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;
    pointer-events:none;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    opacity:0;transition:opacity .25s ease}
  body.in-game #hud{opacity:1}
  .panel{background:linear-gradient(135deg,rgba(14,22,38,.75),rgba(8,14,26,.6));
    backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
    border:1px solid rgba(120,200,255,.18);border-radius:12px;padding:8px 14px 10px;
    box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
  .label{font-size:9px;letter-spacing:2.6px;text-transform:uppercase;color:#7ac2ff;
    opacity:.8;font-weight:800;margin-bottom:3px}
  .value{font-size:22px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
    letter-spacing:-.5px;color:#eaf6ff;text-shadow:0 0 12px rgba(120,200,255,.4)}
  .value small{font-size:11px;font-weight:700;opacity:.5;margin-left:3px;color:#7ac2ff}

  #comboBox{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;
    transform:translateX(-50%) translateY(-12px) scale(.85);z-index:6;
    pointer-events:none;text-align:center;opacity:0;transition:opacity .2s,transform .2s}
  #comboBox.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  #comboBox.pulse{animation:comboPulse .4s ease}
  @keyframes comboPulse{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.28)}100%{transform:translateX(-50%) scale(1)}}
  .combo-label{font-size:8px;letter-spacing:3.5px;opacity:.75;font-weight:900;color:#ffcc66;
    text-shadow:0 0 12px rgba(255,180,80,.8);margin-bottom:1px}
  .combo-value{font-size:32px;font-weight:900;line-height:1;
    background:linear-gradient(180deg,#fff6c0 0%,#ffb347 55%,#ff6b35 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,160,60,.85));font-variant-numeric:tabular-nums}
  .combo-value span{font-size:18px;opacity:.7}

  #boostPanel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;
    z-index:5;pointer-events:none;width:128px;opacity:0;transition:opacity .25s ease}
  body.in-game #boostPanel{opacity:1}
  .boost-track{height:10px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.55);
    border:1px solid rgba(120,200,255,.2);box-shadow:inset 0 1px 4px rgba(0,0,0,.5)}
  #boostFill{height:100%;width:0%;
    background:linear-gradient(90deg,#00e0ff,#4fffd9,#7affd9);
    box-shadow:0 0 12px rgba(90,220,255,.9),0 0 24px rgba(90,220,255,.5);
    transition:width .18s linear;border-radius:999px}
  #boostFill.full{background:linear-gradient(90deg,#ffd166,#ff8c42,#ff6b35);
    box-shadow:0 0 16px rgba(255,140,60,1),0 0 32px rgba(255,140,60,.6);
    animation:boostPulse .45s infinite alternate}
  @keyframes boostPulse{from{filter:brightness(1)}to{filter:brightness(1.4)}}

  #dash{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);left:50%;
    transform:translateX(-50%);z-index:4;pointer-events:none;
    width:min(240px,46vw);height:auto;filter:drop-shadow(0 0 24px rgba(80,180,255,.35));
    opacity:0;transition:opacity .25s ease}
  body.in-game #dash{opacity:1}
  #dashCanvas{display:block;width:100%;height:auto}

  /* ============ TOUCH ============ */
  #touchControls{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
  body.touch.in-game #touchControls{display:block}
  .tc-btn{position:absolute;pointer-events:auto;display:flex;align-items:center;
    justify-content:center;border-radius:50%;touch-action:none;
    transition:transform .08s ease,box-shadow .15s ease,background .15s ease;
    font-weight:900;color:#fff;border:2px solid rgba(255,255,255,.22);
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(20,30,50,.65));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 2px 6px rgba(255,255,255,.15),
      inset 0 -4px 8px rgba(0,0,0,.4)}
  .tc-btn svg{width:46%;height:46%;fill:currentColor;opacity:.95}
  .tc-btn .sub{position:absolute;bottom:8%;font-size:8px;letter-spacing:1.8px;
    opacity:.7;font-weight:800}
  .tc-btn.active{transform:scale(.9);
    box-shadow:0 2px 10px rgba(0,0,0,.6),inset 0 2px 8px rgba(255,255,255,.3),
      inset 0 -2px 6px rgba(0,0,0,.5),0 0 24px currentColor;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),currentColor)}
  .tc-steer{width:78px;height:78px;color:#8fd0ff}
  #btnLeft{left:calc(env(safe-area-inset-left,0px) + 16px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  #btnRight{left:calc(env(safe-area-inset-left,0px) + 106px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  #btnGas{width:96px;height:96px;color:#4fff9a;
    right:calc(env(safe-area-inset-right,0px) + 16px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  #btnBrake{width:68px;height:68px;color:#ff5e5e;
    right:calc(env(safe-area-inset-right,0px) + 122px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  #btnBoost{width:68px;height:68px;color:#ffb347;
    right:calc(env(safe-area-inset-right,0px) + 16px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 124px);
    opacity:0;transform:scale(.7);pointer-events:none;
    transition:opacity .3s ease,transform .3s ease}
  #btnBoost.show{opacity:1;transform:scale(1);pointer-events:auto;
    animation:boostGlow 1s infinite alternate}
  @keyframes boostGlow{
    from{box-shadow:0 0 20px rgba(255,180,60,.6),0 6px 20px rgba(0,0,0,.5)}
    to{box-shadow:0 0 40px rgba(255,180,60,1),0 6px 20px rgba(0,0,0,.5)}}

  /* ============ SCREENS ============ */
  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    text-align:center;padding:0;
    background:linear-gradient(180deg,#0a1018 0%,#0f1a2c 45%,#050a14 100%);
    animation:fadeIn .3s ease;overflow:hidden}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .screen.hidden{display:none}
  .screen::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,transparent 0 40px,
      rgba(90,180,255,.04) 40px 42px,transparent 42px 120px),
      radial-gradient(ellipse at 50% 0%,rgba(60,140,220,.15),transparent 65%);
    pointer-events:none}
  .screen>*{position:relative;z-index:1}

  .top-bar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;gap:10px}
  .coin-pill{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;
    background:linear-gradient(135deg,rgba(255,190,60,.18),rgba(255,140,40,.1));
    border:1px solid rgba(255,190,60,.35);border-radius:999px;
    box-shadow:0 4px 20px rgba(255,160,60,.18),inset 0 1px 0 rgba(255,220,140,.2);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .coin-icon{width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff2a0,#ffb300 60%,#a86a00);
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.6),
      0 0 12px rgba(255,180,40,.6);position:relative}
  .coin-icon::after{content:'S';position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font-weight:900;font-size:11px;
    color:#a86a00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .coin-amount{font-size:18px;font-weight:900;line-height:1;
    font-variant-numeric:tabular-nums;color:#fff2c0;
    text-shadow:0 0 12px rgba(255,180,60,.5);letter-spacing:-.3px}

  .icon-btn{width:44px;height:44px;border-radius:12px;background:rgba(120,200,255,.08);
    border:1px solid rgba(120,200,255,.2);color:#8fd0ff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .12s ease,background .15s ease,color .15s ease;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    -webkit-tap-highlight-color:transparent}
  .icon-btn:hover{background:rgba(120,200,255,.15);color:#cbe6ff}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn svg{width:20px;height:20px;fill:currentColor}
  .mute-btn.muted{color:#ff7a7a}

  /* ============ START ============ */
  #screenStart{justify-content:space-between}
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:8px 24px 0;min-height:0}
  .hero h1{font-size:clamp(38px,10vw,90px);font-weight:900;letter-spacing:-4px;
    line-height:.88;margin-bottom:4px;
    background:linear-gradient(180deg,#fff 15%,#6ec6ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 40px rgba(90,190,255,.5))}
  .hero .tag{font-size:11px;letter-spacing:6px;text-transform:uppercase;
    opacity:.6;font-weight:800;margin-bottom:14px;color:#7ac2ff}
  .hero .subtitle{font-size:13px;opacity:.65;max-width:320px;line-height:1.5;
    margin-bottom:18px}
  .car-preview-card{background:linear-gradient(180deg,rgba(120,200,255,.08),rgba(60,140,220,.03));
    border:1px solid rgba(120,200,255,.18);border-radius:18px;
    padding:14px 22px 16px;display:flex;flex-direction:column;align-items:center;
    box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
    margin-bottom:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    position:relative;min-width:200px}
  .tier-badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    font-size:8px;letter-spacing:2.5px;font-weight:900;padding:3px 10px;
    border-radius:999px;text-transform:uppercase}
  .tier-1{background:linear-gradient(180deg,#7d8590,#4a5260);color:#fff}
  .tier-2{background:linear-gradient(180deg,#4fc3f7,#0288d1);color:#fff}
  .tier-3{background:linear-gradient(180deg,#b388ff,#6a3cd6);color:#fff}
  .tier-4{background:linear-gradient(180deg,#ffb347,#e65100);color:#fff}
  .tier-5{background:linear-gradient(180deg,#fff176,#f57f17);color:#3a1a00;
    box-shadow:0 0 16px rgba(255,220,80,.7)}
  .car-preview-svg{width:130px;height:65px;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));margin-bottom:6px;margin-top:6px}
  .car-preview-name{font-size:15px;font-weight:900;letter-spacing:-.3px;color:#eaf6ff}
  .car-preview-brand{font-size:9px;letter-spacing:3px;opacity:.55;font-weight:800;
    text-transform:uppercase;color:#7ac2ff;margin-top:2px}
  .car-preview-sub{font-size:10px;letter-spacing:2px;opacity:.55;font-weight:700;
    text-transform:uppercase;margin-top:6px;color:#7ac2ff}
  .car-preview-sub strong{color:#ffb347}

  .hero-actions{display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:0 24px calc(env(safe-area-inset-bottom,0px) + 16px);
    width:100%;max-width:480px;margin:0 auto}
  .btn-primary{font:inherit;font-weight:900;font-size:17px;letter-spacing:2px;
    text-transform:uppercase;cursor:pointer;padding:17px 0;width:100%;max-width:340px;
    border:none;border-radius:16px;color:#04121f;
    background:linear-gradient(180deg,#8ee0ff,#22a8e8);
    box-shadow:0 12px 36px rgba(34,168,232,.5),inset 0 -4px 0 rgba(0,0,0,.22),
      inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .12s ease,box-shadow .12s ease;
    -webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center;gap:10px}
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-primary:active{transform:translateY(1px) scale(.98)}
  .btn-primary svg{width:18px;height:18px;fill:currentColor}
  .hero-secondary{display:flex;gap:10px;width:100%;max-width:340px}
  .btn-secondary{flex:1;font:inherit;font-weight:800;font-size:13px;letter-spacing:1.5px;
    text-transform:uppercase;cursor:pointer;padding:14px 0;
    border:1px solid rgba(120,200,255,.25);border-radius:14px;color:#cbe6ff;
    background:linear-gradient(180deg,rgba(120,200,255,.1),rgba(60,140,220,.04));
    box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .12s ease,background .15s ease,color .15s ease;
    display:flex;align-items:center;justify-content:center;gap:8px;
    -webkit-tap-highlight-color:transparent}
  .btn-secondary:hover{background:rgba(120,200,255,.16);color:#eaf6ff}
  .btn-secondary:active{transform:translateY(1px) scale(.98)}
  .btn-secondary svg{width:16px;height:16px;fill:currentColor}

  /* ============ SECTIONS ============ */
  .section-header{padding:0 16px 12px;display:flex;align-items:center;gap:12px}
  .section-title-wrap{flex:1;text-align:left}
  .section-title{font-size:24px;font-weight:900;letter-spacing:-1px;
    color:#eaf6ff;line-height:1}
  .section-subtitle{font-size:10px;letter-spacing:2.5px;opacity:.55;font-weight:800;
    text-transform:uppercase;margin-top:3px;color:#7ac2ff}
  .scroll-content{flex:1;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);touch-action:pan-y}

  /* ============ GARAGE ============ */
  .tier-section{margin-bottom:18px}
  .tier-title{display:flex;align-items:center;gap:10px;margin-bottom:10px;
    padding:0 4px}
  .tier-title-badge{font-size:9px;letter-spacing:2px;font-weight:900;
    padding:3px 9px;border-radius:999px;text-transform:uppercase}
  .tier-title-text{font-size:12px;letter-spacing:2px;font-weight:900;
    color:#7ac2ff;text-transform:uppercase;opacity:.85}
  .tier-title-line{flex:1;height:1px;
    background:linear-gradient(90deg,rgba(120,200,255,.25),transparent)}

  .car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px}
  @media (min-width:600px){.car-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}}
  .car-card{position:relative;
    background:linear-gradient(180deg,rgba(20,32,52,.9),rgba(10,18,32,.85));
    border:1px solid rgba(120,200,255,.16);border-radius:16px;
    padding:12px 12px 14px;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
    overflow:hidden;display:flex;flex-direction:column}
  .car-card.selected{border-color:rgba(80,220,140,.6);
    box-shadow:0 8px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08),
      0 0 0 1px rgba(80,220,140,.35),0 0 32px rgba(80,220,140,.15)}
  .car-card.owned:not(.selected){border-color:rgba(120,200,255,.32)}
  .car-card.locked{opacity:.9}
  .car-card-badge{position:absolute;top:8px;right:8px;font-size:8px;
    letter-spacing:1.5px;font-weight:900;padding:3px 8px;border-radius:999px;
    text-transform:uppercase}
  .car-card-badge.selected{background:linear-gradient(180deg,#6dffa8,#24c96b);color:#052}
  .car-card-badge.owned{background:rgba(120,200,255,.2);color:#a8dfff;
    border:1px solid rgba(120,200,255,.35)}
  .car-card-badge.locked{background:rgba(255,180,60,.15);color:#ffc966;
    border:1px solid rgba(255,180,60,.35)}

  .car-icon-wrap{padding:6px 0 8px;display:flex;align-items:center;
    justify-content:center;position:relative}
  .car-svg-card{width:92px;height:46px;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
  .car-svg-card .body{fill:var(--car-color)}
  .car-svg-card .window{fill:rgba(20,40,60,.85)}
  .car-svg-card .wheel{fill:#111}
  .car-svg-card .rim{fill:#888}

  .car-brand{font-size:8px;letter-spacing:2.5px;font-weight:800;
    color:#7ac2ff;opacity:.65;text-transform:uppercase;margin-bottom:1px}
  .car-name{font-size:13px;font-weight:900;letter-spacing:-.2px;color:#eaf6ff;
    margin-bottom:8px}
  .car-stats{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;flex:1}
  .car-stat{display:flex;justify-content:space-between;align-items:center;
    font-size:10px;padding:2px 0;font-weight:700}
  .car-stat span:first-child{opacity:.55;letter-spacing:1.2px;
    text-transform:uppercase;color:#7ac2ff}
  .car-stat span:last-child{font-variant-numeric:tabular-nums;color:#eaf6ff}

  .car-action{font:inherit;font-weight:900;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;cursor:pointer;padding:9px 0;
    border:none;border-radius:10px;transition:transform .12s ease,filter .15s ease;
    -webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
  .car-action svg{width:12px;height:12px;fill:currentColor}
  .car-action:active{transform:scale(.97)}
  .car-action.buy{background:linear-gradient(180deg,#ffd166,#ff9028);color:#2a1500;
    box-shadow:0 4px 16px rgba(255,150,40,.4),inset 0 -2px 0 rgba(0,0,0,.2);
    position:relative}
  .car-action.buy .price{display:flex;align-items:center;gap:5px}
  .car-action.buy .mini-coin{width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff2a0,#ffb300 60%,#a86a00);
    box-shadow:inset 0 -1px 1px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.5)}
  .car-action.select{background:linear-gradient(180deg,#8ee0ff,#22a8e8);color:#04121f;
    box-shadow:0 4px 16px rgba(34,168,232,.4),inset 0 -2px 0 rgba(0,0,0,.2)}
  .car-action.current{background:rgba(80,220,140,.15);color:#6dffa8;
    border:1px solid rgba(80,220,140,.35);cursor:default}
  .car-action.locked{background:rgba(255,180,60,.1);color:#ffc966;
    border:1px solid rgba(255,180,60,.3);opacity:.65;cursor:not-allowed}

  /* ============ UPGRADES ============ */
  .upgrade-list{display:flex;flex-direction:column;gap:10px;padding-top:4px}
  .upgrade-row{background:linear-gradient(180deg,rgba(20,32,52,.9),rgba(10,18,32,.85));
    border:1px solid rgba(120,200,255,.16);border-radius:14px;
    padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.05);
    display:flex;gap:12px;transition:border-color .2s ease}
  .upgrade-row.maxed{border-color:rgba(80,220,140,.4)}
  .upgrade-icon{width:44px;height:44px;flex-shrink:0;border-radius:12px;
    background:linear-gradient(180deg,rgba(120,200,255,.15),rgba(60,140,220,.06));
    border:1px solid rgba(120,200,255,.2);display:flex;align-items:center;
    justify-content:center;font-size:22px}
  .upgrade-body{flex:1;text-align:left;min-width:0}

<script>
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
if (IS_TOUCH) document.body.classList.add('touch');

const CAR_DB = [

  { id:'bugatti', name:'Hyper Sport', brand:'Lyon', tier:4, color:0x0d3b66, price:520000, shape:'hyper',
    base:{maxSpeed:412, accel:153, brake:246, handling:1.71, boostMax:512, boostAccel:231} },
  { id:'formula', name:'Formula R', brand:'Apex', tier:5, color:0xff2b2b, price:800000, shape:'formula',

  { id:'concept', name:'Concept Zero', brand:'Volta', tier:5, color:0x00e0ff, price:1300000, shape:'concept',
    base:{maxSpeed:452, accel:187, brake:276, handling:1.96, boostMax:562, boostAccel:272} },
  { id:'phantom', name:'Phantom V12', brand:'Phantom', tier:5, color:0x1a1a1a, price:2500000, shape:'phantom',
    base:{maxSpeed:478, accel:202, brake:292, handling:2.12, boostMax:592, boostAccel:296} }
];
const TIER_NAMES = ['', 'Starter', 'Sport', 'Super', 'Hyper', 'Legendarisch'];
const TIER_CLASS = ['', 'tier-1', 'tier-2', 'tier-3', 'tier-4', 'tier-5'];
const TIER_ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];

const UPGRADE_DEFS = [
  { id:'motor',    name:'Motor',      icon:'⚙️', desc:'Verhoogt topsnelheid.',
    unit:'km/u', bonuses:[0,10,22,36,52,72,96,124,158], costMult:1.0 },
  { id:'turbo',    name:'Turbo',      icon:'🌀', desc:'Snellere acceleratie.',
    unit:'km/u/s', bonuses:[0,5,11,18,27,38,51,67,86], costMult:1.1 },
  { id:'remmen',   name:'Remmen',     icon:'🛑', desc:'Sterkere remkracht.',
    unit:'km/u/s', bonuses:[0,14,30,48,68,92,120,152,190], costMult:0.85 },
  { id:'ophanging',name:'Ophanging',  icon:'🎯', desc:'Betere wegligging.',
    unit:'×', bonuses:[0,0.04,0.08,0.13,0.18,0.24,0.32,0.42,0.55], costMult:1.05 },
  { id:'boost',    name:'Boost Tank', icon:'🚀', desc:'Boost-snelheid + boost-accel.',
    unit:'km/u', bonuses:[0,10,22,36,52,72,96,124,158], costMult:1.25 },
  { id:'lucht',    name:'Luchtinlaat',icon:'💨', desc:'Extra topsnelheid via airflow.',
    unit:'km/u', bonuses:[0,7,15,25,37,51,68,88,112], costMult:0.95 }
];
const MAX_LEVEL = 8;
const TIER_UPGRADE_BASE = [0, 120, 450, 1800, 7000, 28000];

function getUpgradeCost(carId, upgradeId, level) {
  const car = getCar(carId);
  const def = UPGRADE_DEFS.find(d => d.id === upgradeId);
  const base = TIER_UPGRADE_BASE[car.tier];
  const mult = Math.pow(1.55, level) * def.costMult;
  return Math.round(base * mult / 5) * 5;
}

const STORAGE_KEY = 'snelwegRacer.profile.v3';
const defaultProfile = { coins: 500, ownedCars: ['hatch'], selectedCar: 'hatch', upgrades: {}, best: 0, bestCombo: 0 };
let profile = JSON.parse(JSON.stringify(defaultProfile));

function ensureUpgrades(carId) {
  if (!profile.upgrades[carId]) {
    profile.upgrades[carId] = {};
    UPGRADE_DEFS.forEach(d => { profile.upgrades[carId][d.id] = 0; });
  }
  return profile.upgrades[carId];
}
function loadProfile() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (typeof s.coins === 'number') profile.coins = s.coins;
      if (Array.isArray(s.ownedCars)) profile.ownedCars = s.ownedCars.slice();
      if (typeof s.selectedCar === 'string') profile.selectedCar = s.selectedCar;
      if (s.upgrades && typeof s.upgrades === 'object') profile.upgrades = s.upgrades;
      if (typeof s.best === 'number') profile.best = s.best;
      if (typeof s.bestCombo === 'number') profile.bestCombo = s.bestCombo;
    }
  } catch (e) {}
  if (!profile.ownedCars.includes('hatch')) profile.ownedCars.push('hatch');
  if (!profile.ownedCars.includes(profile.selectedCar)) profile.selectedCar = 'hatch';
  profile.ownedCars.forEach(id => ensureUpgrades(id));
  ensureUpgrades(profile.selectedCar);
}
function saveProfile() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(profile)); } catch (e) {}
}
function getCar(id) { return CAR_DB.find(c => c.id === id) || CAR_DB[0]; }
function getStats(carId) {
  const car = getCar(carId);
  const ups = profile.upgrades[carId] || ensureUpgrades(carId);
  const lv = id => ups[id] || 0;
  return {
    maxSpeed:   car.base.maxSpeed + UPGRADE_DEFS[0].bonuses[lv('motor')] + UPGRADE_DEFS[5].bonuses[lv('lucht')],
    accel:      car.base.accel + UPGRADE_DEFS[1].bonuses[lv('turbo')],
    brake:      car.base.brake + UPGRADE_DEFS[2].bonuses[lv('remmen')],
    handling:   car.base.handling + UPGRADE_DEFS[3].bonuses[lv('ophanging')],
    boostMax:   car.base.boostMax + UPGRADE_DEFS[4].bonuses[lv('boost')],
    boostAccel: car.base.boostAccel + UPGRADE_DEFS[4].bonuses[lv('boost')] * 0.7
  };
}

const el = id => document.getElementById(id);
let toastTimer;
function showToast(msg, success = false) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.toggle('success', success);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function colorToHex(c) { return '#' + c.toString(16).padStart(6, '0'); }

function carSvgShape(shape, color) {
  const c = colorToHex(color);

    section.className = 'tier-section';
    section.innerHTML = `
      <div class="tier-title">
        <div class="tier-title-badge ${TIER_CLASS[tier]}">Tier ${TIER_ROMAN[tier]}</div>

        <div class="tier-title-line"></div>
      </div>
      <div class="car-grid"></div>
    `;
    const innerGrid = section.querySelector('.car-grid');
    byTier[tier].forEach(car => {
      const owned = profile.ownedCars.includes(car.id);
      const selected = profile.selectedCar === car.id;
      const canAfford = profile.coins >= car.price;
      const stats = getStats(car.id);
      const card = document.createElement('div');
      card.className = 'car-card' + (selected ? ' selected' : (owned ? ' owned' : ' locked'));
      let badge = '';
      if (selected) badge = '<div class="car-card-badge selected">Actief</div>';
      else if (owned) badge = '<div class="car-card-badge owned">Bezit</div>';
      else badge = `<div class="car-card-badge locked">${TIER_ROMAN[car.tier]}</div>`;
      let actionHtml;
      if (selected) {
        actionHtml = '<button class="car-action current" disabled>✓ Actief</button>';
      } else if (owned) {
        actionHtml = `<button class="car-action select" data-action="select" data-car="${car.id}">Selecteer</button>`;
      } else if (canAfford) {
        actionHtml = `<button class="car-action buy" data-action="buy" data-car="${car.id}">
          <span class="price"><span class="mini-coin"></span>${car.price.toLocaleString('nl-NL')}</span>
        </button>`;
      } else {
        actionHtml = `<button class="car-action locked" disabled>🔒 ${car.price.toLocaleString('nl-NL')}</button>`;
      }
      card.innerHTML = `
        ${badge}
        <div class="car-icon-wrap">${carSvgShape(car.shape, car.color)}</div>
        <div class="car-brand">${car.brand}</div>
        <div class="car-name">${car.name}</div>
        <div class="car-stats">
          <div class="car-stat"><span>Top</span><span>${Math.round(stats.maxSpeed)} km/u</span></div>
          <div class="car-stat"><span>Acc</span><span>${Math.round(stats.accel)} km/s</span></div>
          <div class="car-stat"><span>Rem</span><span>${Math.round(stats.brake)} km/s</span></div>
          <div class="car-stat"><span>Hand</span><span>${stats.handling.toFixed(2)}×</span></div>

    });

  });

    btn.addEventListener('click', () => {
      const carId = btn.dataset.car;
      const action = btn.dataset.action;
      if (action === 'select') {
        profile.selectedCar = carId;
        saveProfile();
        showToast('Auto geselecteerd!', true);
        renderGarage();
      } else if (action === 'buy') {
        buyCar(carId);
      }
    });

function buyCar(carId) {
  const car = getCar(carId);
  if (profile.ownedCars.includes(carId)) return;
  if (profile.coins < car.price) { showToast('Niet genoeg munten!'); return; }
  profile.coins -= car.price;
  profile.ownedCars.push(carId);
  profile.selectedCar = carId;
  ensureUpgrades(carId);
  saveProfile();
  showToast(car.name + ' gekocht!', true);
  renderGarage();
  updateCoinsDisplays();
}

function renderUpgrades() {
  const car = getCar(profile.selectedCar);
  el('upgradeCarName').textContent = `${car.brand} ${car.name} · Tier ${TIER_ROMAN[car.tier]}`;
  const list = el('upgradeList');
  list.innerHTML = '';
  const ups = ensureUpgrades(car.id);
  UPGRADE_DEFS.forEach(def => {
    const level = ups[def.id] || 0;
    const maxed = level >= MAX_LEVEL;
    const currentBonus = def.bonuses[level];
    const nextBonus = maxed ? 0 : def.bonuses[level + 1];
    const nextCost = maxed ? 0 : getUpgradeCost(car.id, def.id, level);
    const canAfford = !maxed && profile.coins >= nextCost;
    const row = document.createElement('div');
    row.className = 'upgrade-row' + (maxed ? ' maxed' : '');
    let pipsHtml = '';
    for (let i = 1; i <= MAX_LEVEL; i++) {
      const filled = i <= level;
      const isMaxedPip = maxed && filled;
      pipsHtml += `<div class="pip ${filled ? 'filled' : ''} ${isMaxedPip ? 'maxed' : ''}"></div>`;
    }
    let nextHtml;
    if (maxed) {
      nextHtml = '<span class="upgrade-next muted">Max level bereikt!</span>';
    } else {
      const delta = nextBonus - currentBonus;
      const fmt = v => def.id === 'ophanging' ? '+' + v.toFixed(2) + '×' : '+' + Math.round(v) + ' ' + def.unit;
      nextHtml = `<span class="upgrade-next">Volgende: <span class="delta">${fmt(delta)}</span></span>`;
    }
    let actionHtml;
    if (maxed) {
      actionHtml = '<div class="btn-maxed">MAX</div>';
    } else {
      actionHtml = `<button class="btn-buy" data-action="upgrade" data-upg="${def.id}" ${canAfford ? '' : 'disabled'}>
        <span class="price"><span class="mini-coin"></span>${nextCost.toLocaleString('nl-NL')}</span>
      </button>`;
    }
    row.innerHTML = `
      <div class="upgrade-icon">${def.icon}</div>
      <div class="upgrade-body">
        <div class="upgrade-topline">
          <span class="upgrade-name">${def.name}</span>
          <span class="upgrade-level">Lv ${level}/${MAX_LEVEL}</span>
        </div>
        <div class="upgrade-desc">${def.desc}</div>
        <div class="level-pips">${pipsHtml}</div>
        <div class="upgrade-buy">${nextHtml}${actionHtml}</div>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('button[data-action="upgrade"]').forEach(btn => {
    btn.addEventListener('click', () => buyUpgrade(profile.selectedCar, btn.dataset.upg));
  });
}

function buyUpgrade(carId, upgradeId) {
  const def = UPGRADE_DEFS.find(d => d.id === upgradeId);
  if (!def) return;
  const ups = ensureUpgrades(carId);
  const level = ups[upgradeId] || 0;
  if (level >= MAX_LEVEL) return;
  const cost = getUpgradeCost(carId, upgradeId, level);
  if (profile.coins < cost) { showToast('Niet genoeg munten!'); return; }
  profile.coins -= cost;
  ups[upgradeId] = level + 1;
  saveProfile();
  showToast(def.name + ' → Lv ' + (level + 1), true);
  renderUpgrades();
  updateCoinsDisplays();
}

class AudioEngine {
  constructor() { this.ready = false; }
  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.7;
      this.master.connect(this.ctx.destination);
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -18; this.comp.knee.value = 24; this.comp.ratio.value = 4;
      this.comp.connect(this.master);
      this.ready = true;
    } catch (e) {}
  }
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
  setVolume(v) { if (this.ready) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.08); }
  noiseBurst(i = 0.7) {
    if (!this.ready) return;
    const ctx = this.ctx, sr = ctx.sampleRate, len = Math.floor(sr * 0.6);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
    const g = ctx.createGain(); g.gain.value = i;
    src.connect(hp).connect(g).connect(this.comp);
    src.start(); src.stop(ctx.currentTime + 0.6);
  }
  boostSweep() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const osc = ctx.createOscillator(); osc.type = 'square';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(920, t + 0.35);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    osc.connect(g).connect(this.comp);
    osc.start(); osc.stop(t + 0.5);
  }
}

const SoundFX = {
  ctx: null,
  buffers: {},
  sources: {},
  gains: {},
  volumes: { start: 0.85, accelerate: 0.6, drive: 0.55, brake: 0.75 },
  current: null,
  muted: false,
  ready: false,
  loading: false,
  unlocked: false,

  init() {
    if (this.loading) return;
    this.loading = true;
    
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();

    const files = {
      start: 'autostarten.mp3',
      accelerate: 'acceleratingcar.mp3',
      drive: 'drivingcar.mp3',
      brake: 'remmen.mp3'
    };

    let loadedCount = 0;
    for (const key in files) {
      fetch(files[key])
        .then(r => r.arrayBuffer())
        .then(data => this.ctx.decodeAudioData(data))
        .then(buffer => {
          this.buffers[key] = buffer;
          loadedCount++;
          if (loadedCount === 4) {
            this.ready = true;
            this.startLoops();
          }
        })
        .catch(e => {
          console.warn('Audio load failed:', files[key], e);
          loadedCount++;
          if (loadedCount === 4) {
            this.ready = true;
            this.startLoops();
          }
        });
    }
  },

  unlock() {
    if (!this.ctx) this.init();
    if (!this.ctx) return;
    
    if (this.ctx.state === 'suspended') {
      this.ctx.resume().then(() => {
        this.unlocked = true;
        this.startLoops();
      });
    } else {
      this.unlocked = true;
      this.startLoops();
    }
  },

  startLoops() {
    if (!this.unlocked || !this.ready) return;
    const loops = ['accelerate', 'drive', 'brake'];
    for (const k of loops) {
      if (this.buffers[k] && !this.sources[k]) {
        const src = this.ctx.createBufferSource();
        src.buffer = this.buffers[k];
        src.loop = true;
        const gain = this.ctx.createGain();
        gain.gain.value = 0;
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(0);
        this.sources[k] = src;
        this.gains[k] = gain;
      }
    }
  },

  playStart() {
    if (!this.ready || !this.ctx || !this.buffers.start) return;
    const src = this.ctx.createBufferSource();
    src.buffer = this.buffers.start;
    const gain = this.ctx.createGain();
    gain.gain.value = this.muted ? 0 : this.volumes.start;
    src.connect(gain);
    gain.connect(this.ctx.destination);
    src.start(0);
  },

  setState(key) {
    this.current = key;
    if (this.ready && this.ctx && this.ctx.state === 'running') {
      this.startLoops();
    }
  },

  update(dt) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const loops = ['accelerate', 'drive', 'brake'];
    for (const k of loops) {
      if (this.gains[k]) {
        const target = (k === this.current) ? this.volumes[k] : 0;
        this.gains[k].gain.setTargetAtTime(this.muted ? 0 : target, t, 0.1);
      }
    }
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    updateMuteButtons();
    return this.muted;
  },

  stopAll() {
    if (!this.ctx) return;
    for (const k in this.sources) {
      if (this.sources[k]) {
        try { this.sources[k].stop(); } catch(e){}
        this.sources[k].disconnect();
        this.gains[k].disconnect();
        delete this.sources[k];
        delete this.gains[k];
      }
    }
    this.current = null;
  }
};

class ParticlePool {
  constructor(max) {
    this.pool = []; this.active = [];
    for (let i = 0; i < max; i++) {
      const mat = new THREE.SpriteMaterial({ map: particleTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
      const s = new THREE.Sprite(mat); s.visible = false; scene.add(s); this.pool.push(s);
    }
  }
  spawn(x, y, z, vx, vy, vz, size, life, color, additive = true) {
    if (!this.pool.length) return;
    const s = this.pool.pop();
    s.position.set(x, y, z);
    s.scale.set(size, size, 1);
    s.material.color.setHex(color);
    s.material.opacity = 1;
    s.material.blending = additive ? THREE.AdditiveBlending : THREE.NormalBlending;
    s.visible = true;
    s.userData.vel = { x: vx, y: vy, z: vz };
    s.userData.life = life; s.userData.maxLife = life; s.userData.growth = 1.8;
    this.active.push(s);
  }
  update(dt, dz) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const s = this.active[i], u = s.userData;
      s.position.x += u.vel.x * dt;
      s.position.y += u.vel.y * dt;
      s.position.z += (u.vel.z + dz) * dt;
      u.life -= dt;
      const t = Math.max(0, u.life / u.maxLife);
      s.material.opacity = t * t;
      const grow = 1 + dt * u.growth;
      s.scale.x *= grow; s.scale.y *= grow;
      if (u.life <= 0) { s.visible = false; this.active.splice(i, 1); this.pool.push(s); }
    }
  }
}

function bindTouchButton(id, ctrl) {
  const btn = document.getElementById(id);
  if (!btn) return;
  const setOn = () => {
    if (ctrl === 'boost') { tryBoost(); return; }
    touch[ctrl] = true; btn.classList.add('active');
  };
  const setOff = () => {
    if (ctrl === 'boost') return;
    touch[ctrl] = false; btn.classList.remove('active');
  };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    setOn();
  });
  btn.addEventListener('pointerup', e => { e.preventDefault(); setOff(); });
  btn.addEventListener('pointercancel', () => setOff());
  btn.addEventListener('lostpointercapture', () => setOff());
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

  Object.assign(state, {
    phase: 'countdown', time: 0, countdown: 3.4,
    velocity: 80, playerX: 0, playerVX: 0, roll: 0, yaw: 0, pitch: 0,
    distance: 0, shake: 0, combo: 1, bestCombo: 1, comboTimer: 0,
    boost: 0, boosting: false, boostTime: 0, topSpeed: 80
  });
  spawnTimer = 0.9; padTimer = 5;
  dashSmooth = 0; maxSpeedRecord = 0;

  playerGroup.position.set(0, 0, 0);
  playerGroup.rotation.set(0, 0, 0);
  camera.position.set(0, 6.4, 12.5);
  camera.fov = 72; camera.updateProjectionMatrix();

  seedTraffic();
  hideAllScreens();
  document.body.classList.add('in-game');
  clock.getDelta();
  tickCountdown();
}

function tickCountdown() {
  cdEl.classList.remove('tick', 'go');
  void cdEl.offsetWidth;
  const v = Math.ceil(state.countdown);
  if (v > 1) { cdEl.textContent = v - 1; cdEl.classList.add('tick'); }
  else if (v === 1) { cdEl.textContent = 'GO!'; cdEl.classList.add('go', 'tick'); }
}

function tryBoost() {
  if (state.phase !== 'playing') return;
  if (state.boost < 100 || state.boosting) return;
  state.boost = 0;
  state.boosting = true;
  state.boostTime = 3.0;
  state.shake = 0.6;
  audio.boostSweep();
  flashEl.classList.add('boost', 'on');
  setTimeout(() => flashEl.classList.remove('on'), 200);
  setTimeout(() => flashEl.classList.remove('boost'), 400);
  updateBoostUI();
}

function gameOver() {
  state.phase = 'over';
  state.shake = 1.2;
  if (SoundFX) SoundFX.stopAll();
  audio.noiseBurst(0.85);
  audio.setVolume(0.0);
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 150);

  const car = getCar(profile.selectedCar);
  const dist = Math.floor(state.distance);
  const topSpeed = Math.round(state.topSpeed);
  const tierBonus = (car.tier - 1) * 1200;
  const coinDist = Math.floor(dist * 2.0 * (1 + (car.tier - 1) * 0.15));
  const coinSpeed = Math.floor(topSpeed * 1.8);
  const coinCombo = state.bestCombo * 70;
  const coinsEarned = coinDist + coinSpeed + coinCombo + tierBonus;

  profile.coins += coinsEarned;
  if (dist > profile.best) profile.best = dist;
  if (state.bestCombo > profile.bestCombo) profile.bestCombo = state.bestCombo;
  saveProfile();

  el('finalDist').textContent = dist;
  el('finalTop').textContent = topSpeed + ' km/u';
  el('finalCombo').textContent = 'x' + state.bestCombo;
  el('bestDist').textContent = profile.best + ' m';
  el('coinsEarned').textContent = coinsEarned.toLocaleString('nl-NL');

  document.body.classList.remove('in-game');
  showScreen('over');
}

function update(dt) {
  if (state.phase === 'countdown') {
    const prev = Math.ceil(state.countdown);
    state.countdown -= dt;
    const now = Math.ceil(state.countdown);
    if (now !== prev && now >= 1) tickCountdown();
    if (state.countdown <= 0) { state.phase = 'playing'; cdEl.classList.remove('tick', 'go'); }
    const dz = (state.velocity / 3.6) * SCROLL_SCALE * dt;
    for (const d of dashes) wrapZ(d, dz);
    for (const t of trees)  wrapZ(t, dz);
    for (const p of posts)  wrapZ(p, dz);
    if (SoundFX) SoundFX.update(dt);
    updateDash(state.velocity, false);
    return;
  }
  if (state.phase !== 'playing') {
    if (SoundFX) { SoundFX.setState(null); SoundFX.update(dt); }
    updateDash(state.velocity, false);
    return;
  }

  state.time += dt;
  const gasHeld = !!(keys.ArrowUp || keys.KeyW || touch.gas);
  const brakeHeld = !!(keys.ArrowDown || keys.KeyS || touch.brake);

  if (state.boosting) {
    state.velocity = Math.min(currentStats.boostMax, state.velocity + currentStats.boostAccel * dt);
  } else if (brakeHeld) {
    state.velocity = Math.max(0, state.velocity - currentStats.brake * dt);
  } else if (gasHeld) {
    if (state.velocity < currentStats.maxSpeed) {
      state.velocity = Math.min(currentStats.maxSpeed, state.velocity + currentStats.accel * dt);
    }
  } else {
    state.velocity = Math.max(0, state.velocity - 14 * dt);
  }
  if (state.velocity > state.topSpeed) state.topSpeed = state.velocity;

  const speedKmh = state.velocity;
  const speedMs = speedKmh * KMH_TO_MS;
  state.distance += speedMs * dt;

  let input = 0;
  if (keys.ArrowLeft  || keys.KeyA || touch.left)  input -= 1;
  if (keys.ArrowRight || keys.KeyD || touch.right) input += 1;
  if (pointerSteer !== 0) input = pointerSteer;

  const speedFactor = Math.min(1, 0.4 + speedKmh / 220);
  const accel = 30 * speedFactor * currentStats.handling;
  const friction = 7.0 * (1 / currentStats.handling);
  state.playerVX += input * accel * dt;
  state.playerVX -= state.playerVX * friction * dt;
  state.playerVX = Math.max(-16, Math.min(16, state.playerVX));
  state.playerX += state.playerVX * dt;

  const limit = ROAD_W / 2 - 1.2;
  if (state.playerX < -limit) { state.playerX = -limit; state.playerVX *= -0.2; }
  if (state.playerX >  limit) { state.playerX =  limit; state.playerVX *= -0.2; }

  const vxNorm = state.playerVX / 16;
  const targetYaw   = -vxNorm * 0.22;
  const targetRoll  =  vxNorm * 0.085;
  const targetPitch = brakeHeld && speedKmh > 5 ? 0.05
                    : state.boosting ? -0.035
                    : (gasHeld && speedKmh < currentStats.maxSpeed - 20 ? -0.015 : 0);
  state.yaw   += (targetYaw   - state.yaw)   * Math.min(1, dt * 8);
  state.roll  += (targetRoll  - state.roll)  * Math.min(1, dt * 7);
  state.pitch += (targetPitch - state.pitch) * Math.min(1, dt * 6);
  playerGroup.position.x = state.playerX;
  playerGroup.rotation.set(state.pitch, state.yaw, state.roll);

  const brakeGlow = brakeHeld ? 1.6 : 1.0;
  if (playerGroup.userData.tailLights) {
    playerGroup.userData.tailLights.forEach(tl => {
      tl.material.color.setRGB(1.0, 0.17 * (1 / brakeGlow), 0.17 * (1 / brakeGlow));
      tl.scale.z = brakeGlow;
    });
  }

  playerGroup.children.forEach(c => {
    if (c.userData && c.userData.exhaustGlow) {
      c.material.color.setHex(state.boosting ? 0xff8844 : 0x66ccff);
      c.scale.setScalar(state.boosting ? 1.5 : 1.0);
    }
  });
  const flare = playerGroup.getObjectByName('boostFlare');
  if (flare) {
    const targetOp = state.boosting ? 0.85 : 0;
    flare.material.opacity += (targetOp - flare.material.opacity) * Math.min(1, dt * 10);
    const fs = state.boosting ? 3.8 : 2;
    flare.scale.x += (fs - flare.scale.x) * Math.min(1, dt * 10);
    flare.scale.y += (fs - flare.scale.y) * Math.min(1, dt * 10);
  }

  const camTargetX = state.playerX * 0.62 - state.playerVX * 0.08;
  camera.position.x += (camTargetX - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y = 6.4; camera.position.z = 12.5;
  if (state.shake > 0) {
    camera.position.x += (Math.random() - 0.5) * state.shake * 0.6;
    camera.position.y += (Math.random() - 0.5) * state.shake * 0.6;
    state.shake = Math.max(0, state.shake - dt * 2.5);
  }
  camera.lookAt(state.playerX * 0.4, 1.7, -18);
  const targetFov = 72 + Math.max(0, speedKmh - 100) * 0.14 + (state.boosting ? 8 : 0);
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 4);
  camera.updateProjectionMatrix();

  const dz = speedMs * SCROLL_SCALE * dt;
  for (const d of dashes) wrapZ(d, dz);
  for (const t of trees)  wrapZ(t, dz);
  for (const p of posts)  wrapZ(p, dz);
  for (const c of clouds) { c.position.z += dz * 0.15; if (c.position.z > 100) c.position.z -= 620; }

  particles.update(dt, dz);

  const exhaustProb = state.boosting ? 1 : (gasHeld ? 0.7 : 0.3);
  if (Math.random() < exhaustProb) {
    particles.spawn(state.playerX + (Math.random() - 0.5) * 0.4, 0.52, 2.35,
      (Math.random() - 0.5) * 1.2, 0.6 + Math.random() * 1.5, 3 + Math.random() * 4,
      0.55 + Math.random() * 0.3, 0.45 + Math.random() * 0.3,
      state.boosting ? 0xff8844 : 0x88aaff);
  }
  if (state.boosting) {
    for (let i = 0; i < 3; i++) {
      particles.spawn(state.playerX + (Math.random() - 0.5) * 1.3, 0.6, 2.5,
        (Math.random() - 0.5) * 2, 0.8 + Math.random() * 1.8, 8 + Math.random() * 6,
        0.9 + Math.random() * 0.5, 0.35,
        Math.random() < 0.5 ? 0xff8844 : 0xffcc66);
    }
  }
  if ((brakeHeld && speedKmh > 40) || Math.abs(state.playerVX) > 9) {
    if (Math.random() < 0.5) {
      const side = state.playerVX > 0 ? 1 : (state.playerVX < 0 ? -1 : (Math.random() < 0.5 ? 1 : -1));
      particles.spawn(state.playerX + side * 1.0, 0.2, 1.4,
        side * 0.5, 0.3 + Math.random() * 0.5, 2, 0.5, 0.6, 0xbbbbbb, false);
    }
  }

  padTimer -= dt;
  if (padTimer <= 0 && Math.random() < 0.6) { spawnBoostPad(); padTimer = 5 + Math.random() * 6; }
  for (let i = boostPads.length - 1; i >= 0; i--) {
    const p = boostPads[i];
    p.mesh.position.z += dz;
    p.glow.position.z = p.mesh.position.z;
    p.phase += dt * 4;
    p.glow.material.opacity = 0.5 + 0.35 * Math.sin(p.phase);
    p.mesh.rotation.y += dt * 1.5;
    if (!p.taken && Math.abs(p.mesh.position.z) < 1.8 && Math.abs(p.x - state.playerX) < 2.0) {
      p.taken = true;
      state.boost = Math.min(100, state.boost + 35);
      state.shake = 0.35;
      audio.boostSweep();
      updateBoostUI();
      flashEl.classList.add('boost', 'on');
      setTimeout(() => flashEl.classList.remove('on'), 120);
      setTimeout(() => flashEl.classList.remove('boost'), 350);
    }
    if (p.mesh.position.z > RECYCLE_Z + 5) {
      scene.remove(p.mesh); scene.remove(p.glow); boostPads.splice(i, 1);
    }
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTrafficAt(-270 - Math.random() * 30);
    const base = Math.max(0.45, 1.6 - state.time * 0.016);
    spawnTimer = base * (0.7 + Math.random() * 0.75);
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    const prevZ = o.mesh.position.z;
    const relKmh = speedKmh - o.speedKmh;
    o.mesh.position.z += (relKmh * KMH_TO_MS) * SCROLL_SCALE * dt;
    const newZ = o.mesh.position.z;

    o.bobPhase += dt * 5;
    o.mesh.position.y = Math.sin(o.bobPhase) * 0.02;

    o.laneTimer -= dt;
    if (o.laneTimer <= 0 && !o.changing) {
      o.laneTimer = 3 + Math.random() * 5;
      if (Math.random() < 0.35) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        const curIdx = LANES.indexOf(o.x);
        const newIdx = curIdx + dir;
        if (newIdx >= 0 && newIdx < LANES.length) {
          const tgt = LANES[newIdx];
          let blocked = false;
          for (const other of obstacles) {
            if (other === o) continue;
            if (Math.abs(other.x - tgt) < 2 && Math.abs(other.mesh.position.z - newZ) < 8) { blocked = true; break; }
          }
          if (!blocked && Math.abs(tgt - state.playerX) > 2) { o.changing = true; o.targetX = tgt; }
        }
      }
    }
    if (o.changing) {
      o.x += (o.targetX - o.x) * Math.min(1, dt * 1.8);
      if (Math.abs(o.x - o.targetX) < 0.05) { o.x = o.targetX; o.changing = false; }
    }
    o.mesh.position.x = o.x;

    if (newZ > RECYCLE_Z + 10) { scene.remove(o.mesh); obstacles.splice(i, 1); continue; }

    if (!o.nearMiss && prevZ < 0 && newZ >= 0) {
      const dx = Math.abs(o.x - state.playerX);
      if (dx < 2.6 && dx >= 1.85) {
        o.nearMiss = true;
        state.combo = Math.min(20, state.combo + 1);
        state.bestCombo = Math.max(state.bestCombo, state.combo);
        state.comboTimer = 3.0;
        state.boost = Math.min(100, state.boost + 6 + state.combo);
        state.shake = 0.15;
        updateComboUI(); updateBoostUI();
        const side = Math.sign(o.x - state.playerX) || 1;
        for (let k = 0; k < 5; k++) {
          particles.spawn(state.playerX + side * 1.5, 0.8, 0,
            side * (2 + Math.random() * 3), 1 + Math.random() * 2, -2 + Math.random() * 3,
            0.5, 0.4, 0xffdd66);
        }
      }
    }
    if (Math.abs(o.x - state.playerX) < 1.85 && Math.abs(newZ) < 3.9) {
      for (let k = 0; k < 25; k++) {
        particles.spawn(state.playerX + (Math.random() - 0.5) * 3, 0.8 + Math.random() * 1.5, -1,
          (Math.random() - 0.5) * 12, 2 + Math.random() * 6, 4 + Math.random() * 12,
          0.9, 0.9, Math.random() < 0.5 ? 0xff6622 : 0xffcc33);
      }
      gameOver();
      return;
    }
  }

  if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0 && state.combo > 1) {
      state.combo = 1; updateComboUI();
    }
  }

  // === Geluid op basis van rijstatus ===
  if (SoundFX) {
    const targetSpeed = state.boosting ? currentStats.boostMax : currentStats.maxSpeed;
    let targetSound = null;
    if (brakeHeld && state.velocity > 5) {
      targetSound = 'brake';
    } else if ((gasHeld || state.boosting) && state.velocity < targetSpeed * 0.98) {
      targetSound = 'accelerate';
    } else if (state.velocity > 10) {
      targetSound = 'drive';
    }
    SoundFX.setState(targetSound);
    SoundFX.update(dt);
  }

  if (audio && audio.ready) {
    audio.setVolume(0.25);
  }

  distVal.textContent = Math.floor(state.distance);
  updateDash(speedKmh, state.boosting);
  updateBoostButton();
}

function updateComboUI() {
  if (state.combo > 1) {
    comboBox.classList.add('show');
    comboVal.textContent = state.combo;
    comboBox.classList.remove('pulse');
    void comboBox.offsetWidth;
    comboBox.classList.add('pulse');
  } else comboBox.classList.remove('show');
}
function updateBoostUI() {
  boostFill.style.width = state.boost + '%';
  boostFill.classList.toggle('full', state.boost >= 100);
}
function updateBoostButton() {
  if (state.boost >= 100 && !state.boosting) btnBoostEl.classList.add('show');
  else btnBoostEl.classList.remove('show');
}

const dashCanvas = el('dashCanvas');
const dctx = dashCanvas.getContext('2d');
let dashSmooth = 0;
let maxSpeedRecord = 0;

function updateDash(kmh, boosting) {
  const target = Math.max(0, Math.min(dashMax, kmh));
  dashSmooth += (target - dashSmooth) * 0.18;
  if (dashSmooth > maxSpeedRecord) maxSpeedRecord = dashSmooth;

  const W = dashCanvas.width, H = dashCanvas.height;
  dctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.62;
  const R = W * 0.42;
  const A0 = Math.PI * 1.25;
  const A1 = -Math.PI * 0.25;
  const sweep = A0 - A1;

  dctx.lineCap = 'round';
  dctx.lineWidth = 12;
  dctx.strokeStyle = 'rgba(120,200,255,0.08)';
  dctx.beginPath(); dctx.arc(cx, cy, R, A0, A1, true); dctx.stroke();

  const maxSpeedRatio = currentStats.maxSpeed / dashMax;
  dctx.strokeStyle = 'rgba(255,70,70,0.35)';
  dctx.beginPath();
  dctx.arc(cx, cy, R, A0, A0 - sweep * maxSpeedRatio, true);
  dctx.stroke();

  const ratio = dashSmooth / dashMax;
  const speedColor = boosting ? '#ffb347'
    : ratio > 0.75 ? '#ff5e5e' : ratio > 0.5 ? '#ffcc66' : '#4fffd9';
  dctx.strokeStyle = speedColor;
  dctx.shadowColor = speedColor;
  dctx.shadowBlur = 20;
  dctx.beginPath();
  dctx.arc(cx, cy, R, A0, A0 - sweep * ratio, true);
  dctx.stroke();
  dctx.shadowBlur = 0;

  const numTicks = 24;
  for (let i = 0; i <= numTicks; i++) {
    const t = i / numTicks;
    const a = A0 - sweep * t;
    const r1 = R - 20;
    const r2 = R - (i % 4 === 0 ? 32 : 26);
    dctx.strokeStyle = t <= ratio ? speedColor : 'rgba(120,200,255,0.25)';
    dctx.lineWidth = i % 4 === 0 ? 2.5 : 1.2;
    dctx.beginPath();
    dctx.moveTo(cx + Math.cos(a) * r1, cy - Math.sin(a) * r1);
    dctx.lineTo(cx + Math.cos(a) * r2, cy - Math.sin(a) * r2);
    dctx.stroke();
  }

  const displaySpeed = Math.round(dashSmooth);
  dctx.font = '900 60px "Segoe UI", system-ui, sans-serif';
  dctx.textAlign = 'center';
  dctx.textBaseline = 'middle';
  dctx.fillStyle = '#eaf6ff';
  dctx.shadowColor = speedColor;
  dctx.shadowBlur = 18;
  dctx.fillText(displaySpeed, cx, cy - 8);
  dctx.shadowBlur = 0;

  dctx.font = '700 15px "Segoe UI", system-ui, sans-serif';
  dctx.fillStyle = '#7ac2ff';
  dctx.fillText('km/u', cx, cy + 34);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, IS_MOBILE ? 1.5 : 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene, camera);
}

loadProfile();
updateCoinsDisplays();
updateStartPreview();
updateMuteButtons();
showScreen('start');
animate();

setTimeout(hideLoading, 750);

let _audioUnlocked = false;
function unlockAudioOnce() {
  if (_audioUnlocked) return;
  _audioUnlocked = true;
  audio.init();
  audio.resume();
  SoundFX.unlock();
}
['pointerdown', 'touchstart', 'keydown', 'click'].forEach(evt => {
  document.addEventListener(evt, unlockAudioOnce, { passive: true });
});

document.querySelectorAll('.mute-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    SoundFX.toggleMute();
  });
});
updateMuteButtons();
</script>
</body>
